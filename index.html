<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
<!--Hero-section-start-->
  <section class="relative w-full h-screen bg-[url('./images/background.jpg')] bg-center bg-cover"> -->

  <div class="absolute inset-0 bg-[rgba(0,0,0,0.5)]"></div>

  <header class="relative z-10 max-w-300 mx-auto ">
    <div class="grid sm:grid-cols-2 grid-cols-[30%_auto] items-center px-6 py-5">
      <figure>
        <img class="w-36" src="./images/logo.svg" alt="Netflix">
      </figure>

      <div class="flex justify-end gap-[10px]">
        <div>
          <select name="" id="" class="bg-black text-white font-bold border-1 border-white p-[5px_12px] rounded-[5px]">
            <option value="">English</option>
            <option value="">Hindi</option>
          </select>
        </div>
        <div>
          <button class="bg-red-600 text-white font-bold p-[5px_12px] rounded-[5px]">Sign In</button>
        </div>
      </div>

    </div>
  </header>

</section>
<!--Hero-section-end-->
</body>
</html>
